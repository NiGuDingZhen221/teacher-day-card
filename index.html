<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>给未来的小张老师</title><style>html,body{height:100%;margin:0;background:#030006;overflow:hidden}canvas{width:100%;height:100%;display:block}#hint{position:fixed;bottom:5.5vh;left:0;right:0;text-align:center;color:#e6c9ff;font:13px "Microsoft YaHei",sans-serif;letter-spacing:4px;opacity:.62;text-shadow:0 0 12px #b100ff}</style></head><body><canvas id="c"></canvas><div id="hint">一份送给未来小张老师的祝福</div><script>const c=document.querySelector('#c'),x=c.getContext('2d'),o=document.createElement('canvas'),q=o.getContext('2d');let W,H,D=[],P=[],phrase=0,changeAt=0;const words=[['一路顺风','愿你奔向热爱，走过的每一步都算数'],['考试顺利','愿所有努力，都有温柔又响亮的回音'],['教师节快乐','致未来的小张老师，愿你始终眼里有光'],['前程似锦','终有一天，你会成为照亮他人的那束光']];function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}function dots(text){o.width=W;o.height=H;q.clearRect(0,0,W,H);q.fillStyle='#fff';q.textAlign='center';q.textBaseline='middle';q.font=`900 ${Math.min(W*.16,190)}px "Microsoft YaHei"`;q.fillText(text,W/2,H*.48);let a=q.getImageData(0,0,W,H).data,r=[];for(let y=0;y<H;y+=7)for(let z=0;z<W;z+=7)if(a[(y*W+z)*4+3]>100)r.push({x:z+(Math.random()-.5)*5,y:y+(Math.random()-.5)*5});return r}function begin(first){let target=dots(words[phrase][0]),count=Math.max(P.length,target.length);if(first){P=target.map(t=>({x:t.x,y:t.y,sx:t.x+(Math.random()-.5)*W,sy:t.y+(Math.random()-.5)*H,tx:t.x,ty:t.y,a:0}));}else{P=Array.from({length:count},(_,i)=>{let old=P[i%P.length],t=target[i%target.length];return{x:old.x,y:old.y,sx:old.x,sy:old.y,tx:t.x,ty:t.y,a:1}})}changeAt=performance.now()}function size(){let r=Math.min(devicePixelRatio,1.35,Math.sqrt(1200000/(innerWidth*innerHeight)));W=c.width=Math.max(1,innerWidth*r);H=c.height=Math.max(1,innerHeight*r);D=Array.from({length:Math.ceil(W/21)},(_,i)=>({x:i*21,y:Math.random()*H,s:8+Math.random()*9,v:1+Math.random()*2}));begin(true)}function draw(t){x.fillStyle='rgba(3,0,6,.16)';x.fillRect(0,0,W,H);x.font='14px monospace';D.forEach(d=>{x.fillStyle=`hsla(${270+Math.random()*34},100%,${50+Math.random()*25}%,.53)`;x.fillText(Math.random()>.6?'1':'0',d.x,d.y);d.y+=d.v*d.s;if(d.y>H)d.y=-20});let elapsed=t-changeAt,u=Math.min(1,elapsed/1500),e=ease(u);P.forEach(p=>{p.x=p.sx+(p.tx-p.sx)*e;p.y=p.sy+(p.ty-p.sy)*e;let alpha=Math.min(1,elapsed/500);x.fillStyle=`rgba(247,231,255,${alpha})`;x.beginPath();x.arc(p.x,p.y,1.65,0,7);x.fill()});x.textAlign='center';x.fillStyle='rgba(218,160,255,.92)';x.font=`${Math.min(W*.038,30)}px "Microsoft YaHei"`;x.fillText('致未来的小张老师',W/2,H*.22);x.fillStyle='rgba(238,214,255,.84)';x.font=`${Math.min(W*.022,17)}px "Microsoft YaHei"`;x.fillText(words[phrase][1],W/2,H*.67);if(elapsed>4700){phrase=(phrase+1)%words.length;begin(false)}requestAnimationFrame(draw)}addEventListener('resize',size);size();requestAnimationFrame(draw);</script></body></html>
