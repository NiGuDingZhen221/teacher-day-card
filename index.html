<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教师节快乐 · 小张老师</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #614c36;
      background: linear-gradient(135deg, #fff8e8 0%, #f6e3bc 52%, #dcefdc 100%);
    }
    .light { position: fixed; border-radius: 50%; filter: blur(2px); opacity: .55; }
    .light.one { width: 210px; height: 210px; top: -65px; left: -40px; background: #ffd66b; }
    .light.two { width: 180px; height: 180px; right: -55px; bottom: -45px; background: #a8d8b0; }
    main {
      width: min(88vw, 510px);
      padding: 48px 36px 40px;
      text-align: center;
      background: rgba(255, 253, 247, .88);
      border: 1px solid rgba(174, 128, 62, .2);
      border-radius: 28px;
      box-shadow: 0 22px 60px rgba(108, 79, 40, .18);
      position: relative;
    }
    .leaves { color: #6f9a64; font-size: 34px; letter-spacing: 5px; }
    h1 { margin: 17px 0 6px; color: #a56f32; font-size: clamp(30px, 8vw, 43px); letter-spacing: 3px; }
    .name { margin: 0 0 30px; font-size: 20px; color: #876442; }
    .divider { width: 58px; height: 3px; margin: 0 auto 27px; border-radius: 5px; background: #e4bb78; }
    p { margin: 0; font-size: 18px; line-height: 2; text-align: left; }
    .signature { margin-top: 28px; text-align: right; color: #9f794f; font-size: 16px; }
    .note { margin-top: 38px; font-size: 12px; color: #9c8e7c; }
  </style>
</head>
<body>
  <i class="light one"></i><i class="light two"></i>
  <main>
    <div class="leaves">❀ ❀ ❀</div>
    <h1>教师节快乐</h1>
    <div class="name">致 · 小张老师</div>
    <div class="divider"></div>
    <p>感谢您一直以来的认真、耐心与温暖。愿您眼里有光，心中有爱，所教皆有所得，所盼都能如愿。</p>
    <p>愿每一份辛勤付出都被看见，每一天都被温柔以待。</p>
    <div class="signature">祝福送给最可敬的您</div>
    <div class="note">9 月 10 日 · 教师节</div>
  </main>
</body>
</html>
