<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>给未来的小张老师</title><style>html,body{height:100%;margin:0;background:#030006;overflow:hidden}canvas{width:100%;height:100%;display:block}#hint{position:fixed;bottom:5.5vh;left:0;right:0;text-align:center;color:#e6c9ff;font:13px "Microsoft YaHei",sans-serif;letter-spacing:4px;opacity:.62;text-shadow:0 0 12px #b100ff}</style></head><body><canvas id="c"></canvas><div id="hint">一份送给未来小张老师的祝福</div><script>const c=document.querySelector('#c'),x=c.getContext('2d'),o=document.createElement('canvas'),q=o.getContext('2d');let W,H,D=[],P=[],n=0,at=0;const lines=['一路顺风','考试顺利','前程似锦','未来可期'];function size(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(1,0,0,1,0,0);D=Array.from({length:Math.ceil(W/20)},(_,i)=>({x:i*20,y:Math.random()*H,s:7+Math.random()*9,v:1+Math.random()*2}));make()}function make(){const t=lines[n%lines.length];o.width=W;o.height=H;q.clearRect(0,0,W,H);q.fillStyle='#fff';q.textAlign='center';q.textBaseline='middle';q.font=`900 ${Math.min(W*.16,190)}px "Microsoft YaHei"`;q.fillText(t,W/2,H*.48);P=[];const a=q.getImageData(0,0,W,H).data;for(let y=0;y<H;y+=7)for(let z=0;z<W;z+=7)if(a[(y*W+z)*4+3]>100)P.push({x:z+(Math.random()-.5)*5,y:y+(Math.random()-.5)*5,dx:(Math.random()-.5)*W,dy:(Math.random()-.5)*H});at=performance.now()}function draw(t){x.fillStyle='rgba(3,0,6,.19)';x.fillRect(0,0,W,H);x.font='14px monospace';D.forEach(d=>{x.fillStyle=`hsla(${270+Math.random()*35},100%,${50+Math.random()*25}%,.55)`;x.fillText(Math.random()>.6?'1':'0',d.x,d.y);d.y+=d.v*d.s;if(d.y>H)d.y=-20});let k=Math.min(1,(t-at)/1200);P.forEach(p=>{let px=p.x+(p.dx-p.x)*(1-k),py=p.y+(p.dy-p.y)*(1-k);x.fillStyle=`rgba(246,230,255,${.4+.6*k})`;x.beginPath();x.arc(px,py,1.7,0,7);x.fill()});x.fillStyle='rgba(215,157,255,.9)';x.textAlign='center';x.font=`${Math.min(W*.038,30)}px "Microsoft YaHei"`;x.fillText('致未来的小张老师',W/2,H*.22);x.fillStyle='rgba(235,210,255,.8)';x.font=`${Math.min(W*.022,17)}px "Microsoft YaHei"`;x.fillText('愿你奔向热爱，终会成为照亮他人的那束光',W/2,H*.67);if(t-at>4200){n++;make()}requestAnimationFrame(draw)}addEventListener('resize',size);size();requestAnimationFrame(draw);</script></body></html>
