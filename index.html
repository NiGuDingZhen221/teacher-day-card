<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>给未来的小张老师</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#030006;font-family:"Microsoft YaHei","PingFang SC",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}.page{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}.kicker{position:absolute;top:22%;color:#dba9ff;font-size:clamp(18px,2.2vw,30px);font-weight:700;text-shadow:0 0 16px #a000ff}.stage{position:relative;width:100%;height:clamp(90px,17vw,250px);display:grid;place-items:center}.word{position:absolute;opacity:0;transform:scale(.92);transition:opacity 1.15s ease,transform 1.15s cubic-bezier(.2,.8,.2,1);font-size:clamp(47px,11vw,180px);font-weight:900;letter-spacing:.06em;white-space:nowrap;color:transparent;background-image:radial-gradient(circle,#fff 1.15px,transparent 1.75px);background-size:5px 5px;background-position:center;-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 18px #c03cff)}.word.show{opacity:1;transform:scale(1)}.wish{position:absolute;top:67%;color:#f0d6ff;font-size:clamp(14px,1.7vw,22px);letter-spacing:.08em;text-shadow:0 0 13px #bd47ff}.note{position:absolute;bottom:6%;color:#e3b8ff;font-size:12px;letter-spacing:4px;opacity:.72}</style></head><body><canvas id="rain"></canvas><main class="page"><div class="kicker">致未来的小张老师</div><div class="stage"><div class="word show" id="a">一路顺风</div><div class="word" id="b"></div></div><div class="wish" id="wish">愿你奔向热爱，走过的每一步都算数</div><div class="note">一份送给未来小张老师的祝福</div></main><script>const c=document.querySelector('#rain'),x=c.getContext('2d');let w,h,r,hearts=[];function resize(){r=Math.min(devicePixelRatio,2);w=c.width=innerWidth*r;h=c.height=innerHeight*r;hearts=Array.from({length:Math.ceil(w/28)},(_,i)=>({x:i*28+Math.random()*10,y:Math.random()*h,s:13+Math.random()*14,v:.35+Math.random()*1.1,a:.2+Math.random()*.7}))}function paint(){x.fillStyle='rgba(3,0,6,.14)';x.fillRect(0,0,w,h);x.font='22px "Segoe UI Symbol","Arial Unicode MS",sans-serif';hearts.forEach(p=>{x.fillStyle=`hsla(${315+Math.random()*28},100%,${62+Math.random()*20}%,${p.a})`;x.fillText(Math.random()>.55?'♥':'♡',p.x,p.y);p.y+=p.v;if(p.y>h+25){p.y=-25;p.x=Math.random()*w}});requestAnimationFrame(paint)}addEventListener('resize',resize);resize();paint();const list=[['一路顺风','愿你奔向热爱，走过的每一步都算数'],['考试顺利','愿所有努力，都有温柔又响亮的回音'],['教师节快乐','致未来的小张老师，愿你始终眼里有光'],['前程似锦','终有一天，你会成为照亮他人的那束光']];let i=0,front=document.querySelector('#a'),back=document.querySelector('#b');setInterval(()=>{i=(i+1)%list.length;back.textContent=list[i][0];document.querySelector('#wish').textContent=list[i][1];back.classList.add('show');front.classList.remove('show');[front,back]=[back,front]},4600);</script></body></html>
